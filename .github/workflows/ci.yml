name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # net48 is one of the target frameworks, and building it requires the
    # .NET Framework reference assemblies — those ship on the Windows runner.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # KeriConfigurator owns the solution's single App.config (the consumer
      # exes link to it via <AppConfig>). Its CreateAppConfigFromTemplate target
      # seeds the file on a fresh checkout and then fails the build once, by
      # design, so a developer fills it in. CI is always a fresh checkout, so
      # seed a placeholder first — the target's !Exists('App.config') condition
      # is then false and it is skipped. The offline test suite needs no real
      # connection values.
      - name: Seed placeholder App.config
        shell: pwsh
        run: Copy-Item KeriConfigurator/App.config.template KeriConfigurator/App.config -Force

      - name: Restore
        run: dotnet restore KineticRESTIntegrator.sln

      - name: Build
        run: dotnet build KineticRESTIntegrator.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test (offline, deterministic)
        run: dotnet test KineticRESTIntegrator.Tests --configuration Release --no-build --verbosity normal
